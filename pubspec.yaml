name: teb_cashtrack
description: "CashTrack — controle de contas, cartões, lançamentos e lista de compras."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.1.0+2

environment:
  sdk: ^3.8.1


dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase dependencies
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  cloud_firestore: ^6.0.2
  google_fonts: ^6.1.0
  intl: ^0.20.2
  rxdart: ^0.28.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

# Ícones do app Android, gerados com: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "web/icons/Icon-512.png"
  min_sdk_android: 23
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "web/icons/Icon-512.png"
